<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="login-glass">
        <img src="logo.png" alt="Logo" style="width: 60px; margin-bottom: 15px;" onerror="this.style.display='none'">
        
        <h2 class="mb-4 text-center">Login</h2>

        <span class="badge bg-dark mb-1">Username</span>
        <input type="text" id="username" class="form-control mb-3" placeholder="Enter here">

        <span class="badge bg-dark mb-1">Password</span>
        <div class="position-relative mb-3">
            <input type="password" id="password" class="form-control" placeholder="••••••••">
            <i class="bi bi-eye-slash toggle-eye" onclick="togglePassword()"></i>
        </div>

        <div class="d-flex align-items-center mb-4" style="font-size: 13px; color: #555;">
            <input type="checkbox" id="stayLoggedIn" style="width: 16px; height: 16px; margin-right: 8px; cursor: pointer;">
            <label for="stayLoggedIn" style="cursor: pointer; margin-bottom: 0;">Stay logged in</label>
        </div>

        <div class="d-flex justify-content-center align-items-center gap-2 mb-3">
            <button class="btn btn-primary px-4" onclick="login()">Login</button>
            <button class="btn btn-cancel px-4" onclick="clearFields()">Cancel</button>
        </div>

        <div class="text-center mt-3" style="font-size: 12px;">
            <a href="#" onclick="alert('Please contact your school administrator.');" class="text-decoration-none text-muted">Forgot username / password?</a>
        </div>
    </div>

    <script src="proj.js"></script>
</body>
</html>
